name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        PLATFORM: [pi]
        DISTRO: [bullseye]
    env:
      CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
      ARTLINK_GIT_AUTH: "raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 10
     
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison ccache curl gcc-arm-linux-gnueabihf fakeroot flex git kmod libelf-dev libssl-dev make python3-pip ruby python3-venv unzip
          sudo gem install --no-document fpm

          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install cloudsmith-cli

          # Make cloudsmith available in all later steps
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"

      - name: Setup env
        run: |
          ccache --set-config=compiler_check=content && ccache --set-config=hash_dir=false
          echo "DT=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "CCACHE_WRAPPER_DIR=$HOME/.cache/ccache/bin" >> $GITHUB_ENV
      
      - name: Setup cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache
          restore-keys: |
            ${{ runner.os }}-ccache
            ${{ runner.os }}-ccache-
            
      - name: Build ${{ matrix.PLATFORM }} ${{ matrix.DISTRO }}
        run: |
          export PATH=$CCACHE_WRAPPER_DIR:/usr/lib/ccache:$PATH
          bash buildwithlog.sh ${{ matrix.PLATFORM }} ${{ matrix.DISTRO }} ONLINE
          
      - name: Compose release filename
        run: echo "artifact_name=ohd-kernel-${{ matrix.PLATFORM }}-${{ matrix.DISTRO }}-${GITHUB_REF##*/}" >> $GITHUB_ENV
        
      - name: Package firmware ${{ matrix.PLATFORM }} ${{ matrix.DISTRO }}
        uses: actions/upload-artifact@v7
        with:
          name: "${{ env.artifact_name }}"
          path: |
            *.deb
            *.log
          if-no-files-found: error
